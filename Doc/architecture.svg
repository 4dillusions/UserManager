<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">UserManager architecture</title>
  <desc id="desc">Simplified architecture diagram showing the Backend, Frontend, First Party, and Tests blocks and their project dependencies.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; fill: #16313d; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #4d6571; }
      .group-title { font-size: 26px; font-weight: 700; }
      .item { font-size: 19px; fill: #284550; }
      .card { stroke-width: 2.5; rx: 26; ry: 26; }
      .shadow { opacity: 0.14; }
      .edge { stroke: #456877; stroke-width: 3; fill: none; }
      .edge-label { font-size: 15px; fill: #4d6571; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#456877" />
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#f3f7f9" />
  <rect x="40" y="40" width="1320" height="820" fill="#ffffff" stroke="#d7e1e7" stroke-width="2" rx="30" ry="30" />

  <text x="90" y="110" class="title">UserManager Solution Architecture</text>
  <text x="90" y="145" class="subtitle">High-level project structure only. Runtime and behavioral flow is documented separately.</text>

  <rect x="330" y="176" width="740" height="148" class="shadow" fill="#d7d0e5" />
  <rect x="318" y="164" width="740" height="148" class="card" fill="#efe8fb" stroke="#9c82c9" />
  <text x="356" y="216" class="group-title">First Party</text>
  <text x="356" y="258" class="item">FW4di.Dotnet.Core</text>
  <text x="356" y="292" class="item">FW4di.Dotnet.MVVM</text>

  <rect x="122" y="356" width="428" height="238" class="shadow" fill="#c9dbe5" />
  <rect x="110" y="344" width="428" height="238" class="card" fill="#dff2fb" stroke="#5d9fc2" />
  <text x="148" y="398" class="group-title">Backend</text>
  <text x="148" y="446" class="item">App4di.Dotnet.UserManager.Infrastructure</text>

  <rect x="850" y="356" width="428" height="238" class="shadow" fill="#ddd6c2" />
  <rect x="838" y="344" width="428" height="238" class="card" fill="#fff3dc" stroke="#d2a24a" />
  <text x="876" y="398" class="group-title">Frontend</text>
  <text x="876" y="446" class="item">App4di.Dotnet.UserManager.WPFUI</text>

  <rect x="162" y="656" width="336" height="132" class="shadow" fill="#cddae0" />
  <rect x="150" y="644" width="336" height="132" class="card" fill="#f4f7fb" stroke="#98aab8" />
  <text x="190" y="696" class="group-title">Tests</text>
  <text x="190" y="742" class="item">App4di.Dotnet.UserManager.Tests</text>

  <path d="M318 644 L318 604" class="edge" marker-end="url(#arrow)" />
  <text x="346" y="626" class="edge-label">test coverage</text>

  <path d="M838 463 L538 463" class="edge" marker-end="url(#arrow)" />
  <text x="648" y="446" class="edge-label">uses</text>

  <path d="M500 344 L500 312" class="edge" marker-end="url(#arrow)" />
  <text x="392" y="336" class="edge-label">shared libs</text>

  <path d="M1056 344 L1056 312" class="edge" marker-end="url(#arrow)" />
  <text x="1080" y="336" class="edge-label">shared libs</text>
</svg>
