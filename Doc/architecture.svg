<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">UserManager solution architecture</title>
  <desc id="desc">Dependency-oriented project structure. Frequently referenced foundation modules are placed above modules that depend on them.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; fill: #16313d; }
      .title { font-size: 36px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #4d6571; }
      .rank { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; fill: #78909b; }
      .layer { font-size: 14px; font-weight: 700; letter-spacing: 1.2px; }
      .project { font-size: 20px; font-weight: 650; }
      .detail { font-size: 15px; fill: #49616d; }
      .card { stroke-width: 2.5; }
      .edge { stroke: #456877; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .runtime-edge { stroke: #66818d; stroke-width: 2.7; stroke-dasharray: 9 7; fill: none; marker-end: url(#arrow); }
      .test-edge { stroke: #8296a0; stroke-width: 2.4; stroke-dasharray: 6 6; fill: none; marker-end: url(#test-arrow); }
      .legend { font-size: 14px; fill: #526b77; }
    </style>
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#244653" flood-opacity="0.13" />
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#456877" />
    </marker>
    <marker id="test-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#8296a0" />
    </marker>
  </defs>

  <rect width="1600" height="1180" fill="#f3f7f9" />
  <rect x="35" y="35" width="1530" height="1110" fill="#ffffff" stroke="#d7e1e7" stroke-width="2" rx="30" />

  <text x="85" y="103" class="title">UserManager Solution Architecture</text>
  <text x="85" y="139" class="subtitle">Dependency hierarchy · shared foundations above · composition and tests below · arrows point to dependencies</text>

  <text x="85" y="202" class="rank">SHARED FOUNDATION</text>

  <!-- Domain: the most widely referenced project -->
  <g filter="url(#shadow)">
    <rect x="590" y="175" width="420" height="145" rx="22" class="card" fill="#fde8e6" stroke="#c97870" />
  </g>
  <text x="625" y="211" class="layer" fill="#a5544c">DOMAIN</text>
  <text x="625" y="252" class="project">UserManager.Domain</text>
  <text x="625" y="286" class="detail">UserData model · no project dependencies</text>

  <text x="85" y="360" class="rank">SERVICES AND SHARED LIBRARIES</text>

  <!-- First-party MVVM -->
  <g filter="url(#shadow)">
    <rect x="85" y="380" width="390" height="145" rx="22" class="card" fill="#efe8fb" stroke="#9c82c9" />
  </g>
  <text x="120" y="416" class="layer" fill="#785ca9">FIRST PARTY</text>
  <text x="120" y="457" class="project">FW4di.Dotnet.MVVM</text>
  <text x="120" y="491" class="detail">Commands, notification, messaging</text>

  <!-- Application -->
  <g filter="url(#shadow)">
    <rect x="590" y="380" width="420" height="145" rx="22" class="card" fill="#e4f6ea" stroke="#63a77a" />
  </g>
  <text x="625" y="416" class="layer" fill="#438359">APPLICATION</text>
  <text x="625" y="457" class="project">UserManager.Application</text>
  <text x="625" y="491" class="detail">Use cases, queries and ports/interfaces</text>

  <!-- Runtime data -->
  <g filter="url(#shadow)">
    <rect x="1125" y="380" width="390" height="145" rx="22" class="card" fill="#fff8e9" stroke="#caaa67" />
  </g>
  <text x="1160" y="416" class="layer" fill="#98752e">RUNTIME DATA</text>
  <text x="1160" y="457" class="project">Data/data.xml</text>
  <text x="1160" y="491" class="detail">XML persistence copied to output</text>

  <text x="85" y="600" class="rank">ADAPTERS AND IMPLEMENTATIONS</text>

  <!-- First-party Core -->
  <g filter="url(#shadow)">
    <rect x="85" y="620" width="390" height="145" rx="22" class="card" fill="#efe8fb" stroke="#9c82c9" />
  </g>
  <text x="120" y="656" class="layer" fill="#785ca9">FIRST PARTY</text>
  <text x="120" y="697" class="project">FW4di.Dotnet.Core</text>
  <text x="120" y="731" class="detail">Dependency injection and core utilities</text>

  <!-- Presentation -->
  <g filter="url(#shadow)">
    <rect x="590" y="620" width="420" height="145" rx="22" class="card" fill="#e8f1ff" stroke="#668fc4" />
  </g>
  <text x="625" y="656" class="layer" fill="#436d9e">PRESENTATION</text>
  <text x="625" y="697" class="project">UserManager.Presentation</text>
  <text x="625" y="731" class="detail">ViewModels, navigation, UI sessions</text>

  <!-- Infrastructure -->
  <g filter="url(#shadow)">
    <rect x="1125" y="620" width="390" height="145" rx="22" class="card" fill="#dff2fb" stroke="#5d9fc2" />
  </g>
  <text x="1160" y="656" class="layer" fill="#397fa4">INFRASTRUCTURE</text>
  <text x="1160" y="697" class="project">UserManager.Infrastructure</text>
  <text x="1160" y="731" class="detail">XML repositories and JSON export</text>

  <text x="85" y="840" class="rank">COMPOSITION AND VERIFICATION</text>

  <!-- WPF host -->
  <g filter="url(#shadow)">
    <rect x="315" y="860" width="470" height="155" rx="22" class="card" fill="#fff3dc" stroke="#d2a24a" />
  </g>
  <text x="350" y="896" class="layer" fill="#9b6d19">WPF HOST / COMPOSITION ROOT</text>
  <text x="350" y="937" class="project">UserManager.WPFUI</text>
  <text x="350" y="971" class="detail">Views, validation, platform services, DI bindings</text>

  <!-- Tests -->
  <g filter="url(#shadow)">
    <rect x="850" y="860" width="470" height="155" rx="22" class="card" fill="#f3f6f8" stroke="#91a5af" />
  </g>
  <text x="885" y="896" class="layer" fill="#647b86">TESTS</text>
  <text x="885" y="937" class="project">UserManager.Tests</text>
  <text x="885" y="971" class="detail">Domain, Application, Infrastructure, Presentation</text>

  <!-- Application depends on Domain -->
  <path d="M800 380 L800 320" class="edge" />

  <!-- Presentation dependencies -->
  <path d="M800 620 L800 525" class="edge" />
  <path d="M650 620 L650 565 L280 565 L280 525" class="edge" />
  <path d="M900 620 L1055 620 L1055 345 L900 345 L900 320" class="edge" />

  <!-- Infrastructure dependencies and persistence -->
  <path d="M1125 665 L1060 665 L1060 565 L940 565 L940 525" class="edge" />
  <path d="M1260 620 L1260 570 L1040 570 L1040 345 L940 345 L940 320" class="edge" />
  <path d="M1320 620 L1320 525" class="runtime-edge" />

  <!-- WPFUI dependencies -->
  <path d="M430 860 L280 860 L280 765" class="edge" />
  <path d="M550 860 L550 810 L720 810 L720 765" class="edge" />
  <path d="M680 860 L680 805 L1080 805 L1080 785 L1200 785 L1200 765" class="edge" />
  <path d="M610 860 L610 545 L710 545 L710 525" class="edge" />

  <!-- Test project references -->
  <path d="M930 860 L930 765" class="test-edge" />
  <path d="M1085 860 L1085 815 L1380 815 L1380 765" class="test-edge" />
  <path d="M1000 860 L1000 550 L890 550 L890 525" class="test-edge" />
  <path d="M1160 860 L1160 830 L1540 830 L1540 345 L970 345 L970 320" class="test-edge" />

  <!-- Legend -->
  <line x1="85" y1="1090" x2="135" y2="1090" class="edge" />
  <text x="150" y="1096" class="legend">direct ProjectReference</text>
  <line x1="385" y1="1090" x2="435" y2="1090" class="test-edge" />
  <text x="450" y="1096" class="legend">test ProjectReference</text>
  <line x1="685" y1="1090" x2="735" y2="1090" class="runtime-edge" />
  <text x="750" y="1096" class="legend">runtime persistence</text>
</svg>
