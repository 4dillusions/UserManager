<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">UserManager logo</title>
  <desc id="desc">Logo for the UserManager project combining a user silhouette with a structured management panel and a subtle check accent.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#303231" />
      <stop offset="100%" stop-color="#474747" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E96A6" />
      <stop offset="100%" stop-color="#60D8F0" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E2E2" />
      <stop offset="100%" stop-color="#D2D2D2" />
    </linearGradient>
    <linearGradient id="footer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0B" />
      <stop offset="100%" stop-color="#1A1A1A" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#10212b" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="980" height="500" fill="#E2E2E2" />

  <g filter="url(#shadow)">
    <rect x="80" y="80" width="320" height="320" rx="72" ry="72" fill="url(#bg)" />
    <rect x="80" y="336" width="320" height="14" fill="#29ADC6" />
    <rect x="80" y="350" width="320" height="50" rx="0" ry="0" fill="url(#footer)" />

    <circle cx="184" cy="182" r="50" fill="#E2E2E2" />
    <path d="M110 316c0-48 33-80 74-80s74 32 74 80v10H110z" fill="#E2E2E2" />

    <rect x="266" y="134" width="90" height="42" rx="14" ry="14" fill="url(#panel)" />
    <rect x="266" y="194" width="90" height="42" rx="14" ry="14" fill="url(#panel)" />
    <rect x="266" y="254" width="90" height="42" rx="14" ry="14" fill="url(#panel)" />

    <circle cx="288" cy="155" r="6" fill="#1A1A1A" />
    <rect x="304" y="149" width="34" height="12" rx="6" ry="6" fill="#1A1A1A" opacity="0.88" />

    <circle cx="288" cy="215" r="6" fill="#1A1A1A" />
    <rect x="304" y="209" width="34" height="12" rx="6" ry="6" fill="#1A1A1A" opacity="0.88" />

    <circle cx="288" cy="275" r="6" fill="#1A1A1A" />
    <rect x="304" y="269" width="34" height="12" rx="6" ry="6" fill="#1A1A1A" opacity="0.88" />

    <path d="M310 328l16 16 34-40" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <text x="450" y="206" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="72" font-weight="700" fill="#1A1A1A">UserManager</text>
  <text x="452" y="258" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="24" fill="#474747">Desktop user administration for the 4di app</text>

  <g transform="translate(452 322)">
    <rect x="0" y="0" width="288" height="14" rx="7" ry="7" fill="#CFCFCF" />
    <rect x="0" y="42" width="230" height="14" rx="7" ry="7" fill="#CFCFCF" />
    <rect x="0" y="84" width="258" height="14" rx="7" ry="7" fill="#CFCFCF" />

    <rect x="0" y="0" width="176" height="14" rx="7" ry="7" fill="#29ADC6" />
    <rect x="0" y="42" width="142" height="14" rx="7" ry="7" fill="#1E96A6" />
    <rect x="0" y="84" width="198" height="14" rx="7" ry="7" fill="#60D8F0" />
  </g>
</svg>
