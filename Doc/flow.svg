<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc">
  <title id="title">UserManager flow</title>
  <desc id="desc">Runtime flow diagram for the UserManager application, showing startup, login, list, filtering, edit, save, cancel, and export behavior.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; fill: #16313d; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #4d6571; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 16px; fill: #284550; }
      .small { font-size: 15px; fill: #4d6571; }
      .card { stroke-width: 2.5; rx: 24; ry: 24; }
      .decision { stroke-width: 2.5; }
      .edge { stroke: #456877; stroke-width: 3; fill: none; }
      .edge-soft { stroke: #6c8592; stroke-width: 2.5; fill: none; stroke-dasharray: 9 7; }
      .edge-label { font-size: 15px; fill: #4d6571; }
      .shadow { opacity: 0.14; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#456877" />
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#6c8592" />
    </marker>
  </defs>

  <rect width="1600" height="1280" fill="#f3f7f9" />
  <rect x="40" y="40" width="1520" height="1200" fill="#ffffff" stroke="#d7e1e7" stroke-width="2" rx="30" ry="30" />

  <text x="90" y="110" class="title">UserManager Runtime Flow</text>
  <text x="90" y="145" class="subtitle">Separate flow view for application behavior, navigation, and file operations.</text>

  <rect x="590" y="180" width="420" height="120" class="shadow" fill="#cddae0" />
  <rect x="578" y="168" width="420" height="120" class="card" fill="#eef5f8" stroke="#90a9b7" />
  <text x="614" y="214" class="label">Application startup</text>
  <text x="614" y="248" class="body">DI bindings and WPF services are registered</text>
  <text x="614" y="274" class="small">Main window opens with MainViewModel as DataContext</text>

  <rect x="590" y="360" width="420" height="140" class="shadow" fill="#c8dbe5" />
  <rect x="578" y="348" width="420" height="140" class="card" fill="#dff2fb" stroke="#5d9fc2" />
  <text x="614" y="394" class="label">Login view</text>
  <text x="614" y="428" class="body">ViewType = Login</text>
  <text x="614" y="454" class="small">User enters login name and password</text>

  <polygon points="788,548 928,648 788,748 648,648" class="decision" fill="#fff3dc" stroke="#d2a24a" />
  <text x="788" y="632" class="label" text-anchor="middle">Credentials valid?</text>
  <text x="788" y="662" class="small" text-anchor="middle">User.IsUserExist reads data.xml</text>

  <rect x="1092" y="594" width="304" height="108" class="shadow" fill="#ddd6c2" />
  <rect x="1080" y="582" width="304" height="108" class="card" fill="#fff3dc" stroke="#d2a24a" />
  <text x="1112" y="626" class="label">Login error</text>
  <text x="1112" y="660" class="body">Message dialog shown</text>

  <rect x="550" y="820" width="500" height="164" class="shadow" fill="#c9dbe5" />
  <rect x="538" y="808" width="500" height="164" class="card" fill="#dff2fb" stroke="#5d9fc2" />
  <text x="576" y="854" class="label">User list view</text>
  <text x="576" y="888" class="body">ViewType = UserList</text>
  <text x="576" y="914" class="small">Loads users from data.xml, builds city list, selects current user</text>
  <text x="576" y="940" class="small">Find refreshes the filtered list in memory</text>

  <rect x="120" y="840" width="304" height="120" class="shadow" fill="#d7d0e5" />
  <rect x="108" y="828" width="304" height="120" class="card" fill="#efe8fb" stroke="#9c82c9" />
  <text x="140" y="872" class="label">Export JSON</text>
  <text x="140" y="906" class="body">Exports current visible list</text>
  <text x="140" y="932" class="small">Writes data.json and shows result message</text>

  <rect x="1180" y="840" width="304" height="120" class="shadow" fill="#ddd6c2" />
  <rect x="1168" y="828" width="304" height="120" class="card" fill="#fff3dc" stroke="#d2a24a" />
  <text x="1200" y="872" class="label">Edit selected user</text>
  <text x="1200" y="906" class="body">Stores CurrentUsers snapshot</text>
  <text x="1200" y="932" class="small">Navigates to user editor</text>

  <rect x="1092" y="1040" width="380" height="152" class="shadow" fill="#d8e5d0" />
  <rect x="1080" y="1028" width="380" height="152" class="card" fill="#e7f4e5" stroke="#79b06d" />
  <text x="1116" y="1074" class="label">User edit view</text>
  <text x="1116" y="1108" class="body">ViewType = User</text>
  <text x="1116" y="1134" class="small">User fields are edited with WPF validation rules</text>
  <text x="1116" y="1160" class="small">Save or Cancel returns to the list</text>

  <rect x="460" y="1060" width="320" height="112" class="shadow" fill="#d7d0e5" />
  <rect x="448" y="1048" width="320" height="112" class="card" fill="#efe8fb" stroke="#9c82c9" />
  <text x="480" y="1092" class="label">Save</text>
  <text x="480" y="1126" class="body">UserList.SaveCurrentUsers writes data.xml</text>

  <rect x="96" y="560" width="330" height="132" class="shadow" fill="#d8e5d0" />
  <rect x="84" y="548" width="330" height="132" class="card" fill="#e7f4e5" stroke="#79b06d" />
  <text x="116" y="594" class="label">Persistent data</text>
  <text x="116" y="628" class="body">data.xml is the primary store</text>
  <text x="116" y="654" class="small">Login, list loading, and save use the XML file</text>

  <rect x="96" y="980" width="330" height="112" class="shadow" fill="#cddae0" />
  <rect x="84" y="968" width="330" height="112" class="card" fill="#eef5f8" stroke="#90a9b7" />
  <text x="116" y="1012" class="label">Export file</text>
  <text x="116" y="1046" class="body">data.json receives the exported list</text>

  <path d="M788 288 L788 348" class="edge" marker-end="url(#arrow)" />
  <path d="M788 488 L788 548" class="edge" marker-end="url(#arrow)" />

  <path d="M648 648 L414 648" class="edge-soft" marker-end="url(#arrowSoft)" />
  <text x="498" y="630" class="edge-label">reads XML</text>

  <path d="M928 648 L1080 648" class="edge" marker-end="url(#arrow)" />
  <text x="992" y="630" class="edge-label">No</text>

  <path d="M1232 690 L1232 724 L788 724 L788 748" class="edge-soft" marker-end="url(#arrowSoft)" />
  <text x="990" y="708" class="edge-label">retry login</text>

  <path d="M788 748 L788 808" class="edge" marker-end="url(#arrow)" />
  <text x="812" y="784" class="edge-label">Yes</text>

  <path d="M538 892 L412 892" class="edge" marker-end="url(#arrow)" />
  <text x="438" y="874" class="edge-label">Export command</text>

  <path d="M272 948 L272 968" class="edge-soft" marker-end="url(#arrowSoft)" />
  <text x="294" y="962" class="edge-label">writes</text>

  <path d="M1038 892 L1168 892" class="edge" marker-end="url(#arrow)" />
  <text x="1086" y="874" class="edge-label">Edit command</text>

  <path d="M1270 960 L1270 1028" class="edge" marker-end="url(#arrow)" />

  <path d="M1080 1104 L768 1104" class="edge" marker-end="url(#arrow)" />
  <text x="908" y="1086" class="edge-label">Save</text>

  <path d="M608 1048 L608 984" class="edge" marker-end="url(#arrow)" />
  <text x="632" y="1018" class="edge-label">back to list</text>

  <path d="M1270 1028 L1270 984 L1038 984" class="edge-soft" marker-end="url(#arrowSoft)" />
  <text x="1156" y="1000" class="edge-label">Cancel</text>

  <path d="M538 860 L414 860 L414 680" class="edge-soft" marker-end="url(#arrowSoft)" />
  <text x="430" y="778" class="edge-label">initial load / refresh source</text>

  <path d="M448 1104 L414 1104 L414 680" class="edge-soft" marker-end="url(#arrowSoft)" />
  <text x="182" y="886" class="edge-label">save writes XML</text>
</svg>
